name: Job Radar

on:
  schedule:
    # Every 30 minutes, away from the top of the hour when GitHub runs get delayed.
    - cron: "12,42 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        default: run
        options: [run, doctor, test-alert]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test a site or alert
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'run' }}
        env:
          MODE: ${{ inputs.mode }}
        run: python -m radar "$MODE"

      - name: Check for new jobs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'run' }}
        run: python -m radar run

      - name: Save job history
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'run' }}
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add state/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update job history"
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            # GitHub pauses schedules after 60 quiet days, so leave a monthly marker.
            git commit --allow-empty -m "Keep schedule active"
          fi
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push

      - name: Package dashboard
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'run' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Publish dashboard
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'run' }}
        # Alerts and history are already saved, so a Pages problem should not fail the run.
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
